<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />
<title>绝对死锁防弹版</title>
<style>
  :root {
    --primary: #4f7cff;
    --green: #35d49a;
  }

  [data-theme="dark"] {
    --bg-base: #151a24;
    --text-strong: #eef2fb;
    --text-muted: #8b95a5;
    --pill-bg: rgba(30, 36, 48, 0.6);
    --line: rgba(255, 255, 255, 0.1);
  }

  [data-theme="light"] {
    --bg-base: #eef1f7;
    --text-strong: #101728;
    --text-muted: #616c83;
    --pill-bg: rgba(255, 255, 255, 0.6);
    --line: rgba(20, 32, 64, 0.08);
  }

  /* 【终极死锁】强制满屏，哪怕浏览器底层想拉也拉不动 */
  html {
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-base);
  }
  body {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--bg-base);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text-strong);
    background-image: radial-gradient(circle at 50% 0%, rgba(79,124,255,.1), transparent 50%);
    touch-action: none; /* 禁止系统触摸手势 */
  }

  /* 顶部绝对钉死 */
  .topbar-wrap {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    z-index: 9999;
    height: 46px;
    transform: translate3d(0, 0, 0); /* 强制开启硬件加速，防重绘位移 */
    will-change: transform;
  }

  .brand {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    color: var(--text-strong);
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), var(--green));
    display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff;
  }

  .page-pill {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    height: 34px;
    padding: 0 16px;
    border-radius: 999px;
    background: var(--pill-bg);
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 600;
  }
  .page-pill svg { width: 14px; height: 14px; color: var(--primary); }

  .top-actions {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .theme-btn {
    background: transparent; border: none; padding: 0; cursor: pointer;
    color: var(--text-muted);
  }
  .theme-btn svg { width: 20px; height: 20px; }

  .login-link {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }

  /* 内部滚动区，开启独立滚动 */
  .app-scroll {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-top: 70px;
    padding-bottom: 40px;
    box-sizing: border-box;
    overscroll-behavior-y: contain; /* 防止滚动链传递到外部 */
    touch-action: pan-y; /* 只允许垂直滑动 */
  }

  .content { padding: 10px 20px; display: flex; flex-direction: column; gap: 20px; }
  .box {
    height: 150px; border-radius: 16px;
    background: rgba(128,128,128,0.1);
    border: 1px dashed rgba(128,128,128,0.2);
    display: grid; place-items: center; font-size: 14px; color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="topbar-wrap">
  <div class="brand">
    <div class="brand-mark">28</div>
    <span>PC28</span>
  </div>

  <div class="page-pill">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21s-7-5.1-7-11a7 7 0 1 1 14 0c0 5.9-7 11-7 11z"/>
      <circle cx="12" cy="10" r="2.5"/>
    </svg>
    <span>首页</span>
  </div>

  <div class="top-actions">
    <button class="theme-btn" onclick="toggleTheme()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <a class="login-link">去登录/注册</a>
  </div>
</div>

<div class="app-scroll" id="appScroll">
  <div class="content">
    <div class="box">向下拉拉看？</div>
    <div class="box">如果连整个屏幕都拉不动了，说明代码生效了</div>
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    html.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
  }

  // 【最极端的拦截】
  (function() {
    var appScroll = document.getElementById('appScroll');
    var startY = 0;

    // 禁止 document 的任何默认滑动
    document.addEventListener('touchmove', function(e) {
      var isInsideScroll = e.target.closest('#appScroll');
      
      if (!isInsideScroll) {
        if (e.cancelable) e.preventDefault();
        return;
      }
      
      var dy = e.touches[0].clientY - startY;
      
      // 如果在最顶部还要往下拉，强制阻断！
      if (appScroll.scrollTop <= 0 && dy > 0) {
        if (e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) startY = e.touches[0].clientY;
    }, { passive: false });
  })();
</script>
</body>
</html>
